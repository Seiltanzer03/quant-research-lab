name: Source connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/probe_sources.py', '.github/workflows/sources.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/probe_sources.py
