name: Research and Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research-and-pages
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Check research contracts
        run: ruff check backend scripts && pytest -q
      - name: Restore durable pilot state
        run: python scripts/state.py restore
      - name: Import and run fixed research protocol
        run: python -m backend.app.cli build --data-dir state-store/state --inputs inputs --auto-demo --public
      - name: Persist raw files, Parquet and append-only journals
        run: python scripts/state.py save
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/dist
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Research state recovery artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: research-state-${{ github.run_id }}
          path: state-store/state
          retention-days: 14
          if-no-files-found: ignore
