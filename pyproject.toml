[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-lab"
version = "0.2.0"
description = "Reproducible range research; a static dashboard with honest data and model gates"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2", "numpy>=2.2,<3", "pandas>=2.2,<4", "pyarrow>=19,<24",
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
